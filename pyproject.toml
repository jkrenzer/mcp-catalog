[project]
name = "mcp-catalog"
version = "0.1.0"
description = "Declarative MCP server catalog builder and publisher."
readme = "README.md"
requires-python = ">=3.13,<4.0"
authors = [
  { name = "jkrenzer" }
]
license = { text = "MIT" }
keywords = ["mcp", "catalog", "docker", "oci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pydantic>=2.9.2",
  "ruamel.yaml>=0.18.6",
  "typer>=0.12.5",
]

[project.optional-dependencies]
mcp = ["fastmcp (>=4.1.8,<5.0.0)"]

[project.scripts]
mcp-catalog = "mcp_catalog.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_configs = true

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
agents = [
    "uv (>=0.13.7,<0.14.0)",
]
dev = [
    "ruff (>=0.17.4,<0.18.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "poetry (>=2.5.1,<3.0.0)",
    "poethepoet (>=0.49.0,<0.50.0)",
    "commitizen (>=4.19.3,<5.0.0)",
    "uv (>=0.13.7,<0.14.0)"
]
